name: Agreena

description: Agreena is a Copenhagen-based agtech and climate finance company, founded in 2021, that helps
  farmers transition to regenerative agriculture and monetize the resulting soil-carbon outcomes. Its
  AgreenaCarbon platform combines farmer enrollment, a satellite-, AI-, and soil-sampling-based digital
  measurement, reporting and verification (dMRV) engine, and Verra-certified carbon credit issuance. Agreena
  also offers standalone remote-sensing products such as a field-boundary-detection API for agrifood supply-chain
  monitoring. The platform spans roughly 5 million hectares and 2,500+ farmers across ~20 European countries.
  This profile was surfaced as a portfolio company of Anthemis and HV Capital and is being enriched by
  the API Evangelist pipeline; Agreena publishes no public developer portal or OpenAPI surface at this
  time.

